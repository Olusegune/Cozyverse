name: Build check

# Matrix across all three desktop OSes — keyring's storage backend is now
# selected per-target in src-tauri/Cargo.toml (windows-native / apple-native /
# linux-native-sync-persistent), which was the one real blocker to building
# here at all. This still only compiles for macOS/Linux; the actual installer
# targets (dmg/deb/appimage) aren't wired into `tauri.conf.json` yet — that's
# a separate, deliberate step once there's a reason to actually ship those
# builds, not something to add silently alongside a compile check.
on:
  push:
    branches: [main, decompose-golden-path]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Tauri's own Linux runtime + build-time deps (webkit2gtk for the
      # webview, libdbus for keyring's Secret Service fallback). macOS and
      # Windows runners ship everything Tauri needs already.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check + build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --release
        working-directory: src-tauri

      # Debug build here (not --release) — this just needs to catch a compile
      # break fast; a release build + installer is release.yml's job, and
      # Windows-only there until Mac/Linux installer targets are deliberately
      # added to tauri.conf.json.
      - name: Rust build
        run: cargo build
        working-directory: src-tauri

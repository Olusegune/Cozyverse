[package]
name = "cozyverse-studio"
version = "0.2.0"
description = "Cozyverse Studio — local-first Cozyverse creator"
authors = ["Wheelbarrow Studios"]
edition = "2021"

[lib]
name = "cozyverse_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["time", "process", "macros", "rt", "rt-multi-thread", "sync"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
zip = "2"
walkdir = "2"

# Shared Meshy + Tripo transport, lifted from ModelForge 1.3.0. See
# ../../crates/modelforge-core and ../../README.md.
modelforge-core = { path = "../crates/modelforge-core" }

# `keyring`'s backend is a build-time Cargo feature, not a runtime choice — the crate has no single
# feature that works everywhere, so each OS needs its own storage backend selected at compile time.
# The actual usage (keyring::Entry::new/.get_password()/.set_password()) is identical across all
# three and needed zero code changes; this was purely a Cargo.toml gap, not an API one.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Apple's Keychain — the standard, always-available credential store on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Plain kernel keyring (linux-keyutils) — no D-Bus, no daemon dependency, no extra system library
# at compile time. Tried "linux-native-sync-persistent" (kernel keyring + a D-Bus Secret Service
# fallback via dbus-secret-service/zbus) first, but that pulled in a much larger, more fragile
# dependency chain (zbus, a full crypto stack for the Secret Service's own encryption) that failed
# to compile in CI on ubuntu-latest — see the exact failure in that run before trying to re-add the
# D-Bus fallback. The kernel keyring alone is a real, working credential store; the caveat is that
# some minimal/container Linux setups don't persist it across a full logout the way GNOME
# Keyring/KWallet would.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
